<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leggo e Conto · Backoffice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Backoffice di Leggo e Conto: una colonna, schede per stato, una scheda per famiglia. */
:root{
  --bg:#FFEFC2; --paper:#FFFFFF; --ink:#1E1838; --muted:#5C4A2E; --line:#EAD7A6; --edge:#1E1838;
  --sun:#FFC400; --sun-deep:#B86A00; --wait:#FF9A2E; --ok:#2E9E5B; --stop:#B0185E;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Andika","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1A14;--paper:#2C251C;--ink:#FFF8EC;--muted:#D9C9A8;--line:#4A3E2C;--edge:#0B0816;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1A14;--paper:#2C251C;--ink:#FFF8EC;--muted:#D9C9A8;--line:#4A3E2C;--edge:#0B0816;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.1}
h1{font-size:2rem} h2{font-size:1.3rem}
button,input{font:inherit;color:inherit}
.btn{border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--edge);padding:8px 14px;font-family:var(--f-display);font-weight:700;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--sun);color:#1E1838}
.btn.ok{background:var(--ok);color:#fff}
.btn.stop{background:var(--stop);color:#fff}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid #7A5CFF;outline-offset:2px}
.card{background:var(--paper);border:2.5px solid var(--edge);border-radius:18px;padding:14px 16px;box-shadow:0 3px 0 var(--edge)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:12px;max-width:420px;margin-top:18px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.form input{border:2.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.msg{font-weight:700;color:var(--stop);margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.tabs button{border:2.5px solid var(--edge);border-radius:999px;background:var(--paper);padding:6px 14px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sun);color:#1E1838}
.tabs .n{display:inline-block;min-width:1.6em;margin-left:6px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.85em;padding:0 6px;text-align:center}
.list{display:flex;flex-direction:column;gap:12px}
.u-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.u-name{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.9rem;color:#fff}
.chip.sosp{background:#FFB020;color:#1E1838}
.pl-sociale{background:#CDEBD3;color:#1E1838} .pl-prova{background:#FFE7A8;color:#1E1838} .pl-base{background:#CFE3FF;color:#1E1838} .pl-premium{background:#E7D6FF;color:#1E1838} .pl-scaduto{background:#FFD0D0;color:#1E1838}
.chip + .chip{margin-left:6px} .piano{margin:6px 0 0} .check{margin:0;padding-left:4px;list-style:none} .check li{margin:6px 0} code.url{word-break:break-all;background:#F3F1EA;padding:2px 6px;border-radius:6px}
.st-in_attesa{background:var(--wait);color:#1E1838} .st-attivo{background:var(--ok)} .st-bloccato{background:var(--stop)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;margin:8px 0;color:var(--muted);font-size:.95rem}
.meta b{color:var(--ink)}
.kids{margin:6px 0 0;padding-left:20px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pw{margin-top:8px;font-weight:700}
.pw code{font-size:1.2rem;background:var(--bg);padding:2px 8px;border-radius:8px;user-select:all}
.empty{color:var(--muted)}
.linkbtn{background:none;border:0;padding:2px 0;font-weight:700;text-decoration:underline;color:var(--ink);cursor:pointer;align-self:flex-start}
.alert{margin-top:16px;background:#FF9A2E;color:#1E1838;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:.95rem;vertical-align:top}
th{font-family:var(--f-display);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Leggo e Conto · Backoffice</h1>
    <div id="hBtns" hidden><button class="btn" id="reload">Aggiorna</button> <button class="btn" id="out">Esci</button></div>
  </div>

  <form class="card form" id="login" novalidate>
    <p style="margin:0">Entra con l'email e la password dell'<b>amministratore del Diario Salute</b>.</p>
    <label for="em">Email<input id="em" type="text" inputmode="email" autocomplete="username"></label>
    <label for="pw">Password<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="msg" id="lmsg" hidden></p>
    <button class="btn go" type="submit">Entra</button>
    <button class="linkbtn" type="button" id="lost">Password dimenticata?</button>
  </form>

  <form class="card form" id="nuova" novalidate hidden>
    <p style="margin:0"><b>Scegli la password nuova</b> dell'amministratore (vale anche per il Diario).</p>
    <label for="np1">Password nuova (almeno 8 caratteri)<input id="np1" type="password" autocomplete="new-password"></label>
    <label for="np2">Riscrivila<input id="np2" type="password" autocomplete="new-password"></label>
    <p class="msg" id="nmsg" hidden></p>
    <button class="btn go" type="submit">Salva la password</button>
  </form>

  <div id="panel" hidden>
    <div class="card alert" id="alert" hidden></div>
    <div class="card alert" id="sosp" hidden></div>
    <p class="empty" id="mailInfo" style="margin:12px 0 0"></p>
    <div class="tabs" id="tabs">
      <button data-t="in_attesa" aria-pressed="true">Da approvare<span class="n" id="n-in_attesa">0</span></button>
      <button data-t="attivo" aria-pressed="false">Attivi<span class="n" id="n-attivo">0</span></button>
      <button data-t="scaduto" aria-pressed="false">Scaduti<span class="n" id="n-scaduto">0</span></button>
      <button data-t="bloccato" aria-pressed="false">Bloccati<span class="n" id="n-bloccato">0</span></button>
      <button data-t="accessi" aria-pressed="false">Ultimi accessi</button>
      <button data-t="odoo" aria-pressed="false">Odoo</button>
    </div>
    <div class="list" id="list"></div>
    <div class="card tablewrap" id="acc" hidden></div>
    <div class="card" id="odoo" hidden></div>
  </div>
</div>
<script>
'use strict';
var API = 'https://diario-salute-api.onrender.com';
var $ = function (s) { return document.querySelector(s); };
var tok = null; try { tok = sessionStorage.getItem('lc-admin'); } catch (e) {}
var utenti = [], tab = 'in_attesa', pwArm = {}, delArm = {};
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function when(t) { if (!t) return '–'; var d = new Date(t); return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }
function api(path, opts) {
  opts = opts || {};
  opts.headers = { 'Content-Type': 'application/json' };
  if (tok) opts.headers.Authorization = 'Bearer ' + tok;
  return fetch(API + path, opts).then(function (r) {
    if (r.status === 204) return null;
    return r.json().catch(function () { return null; }).then(function (j) {
      if (!r.ok) { var e = new Error((j && j.detail) || ('Errore ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}
function msg(t) { $('#lmsg').textContent = t; $('#lmsg').hidden = !t; }
$('#login').addEventListener('submit', function (e) {
  e.preventDefault(); msg('Controllo... (la prima volta della giornata può volerci un minuto)');
  api('/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#em').value.trim(), password: $('#pw').value }) })
    .then(function (r) { tok = r.access_token; try { sessionStorage.setItem('lc-admin', tok); } catch (x) {} $('#pw').value = ''; msg(''); load(); })
    .catch(function (x) { msg(x.status ? x.message : 'Non riesco a collegarmi al server'); });
});
$('#out').onclick = function () { tok = null; try { sessionStorage.removeItem('lc-admin'); } catch (e) {} $('#panel').hidden = true; $('#hBtns').hidden = true; $('#login').hidden = false; };
$('#reload').onclick = function () { load(); };
$('#tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t;
  document.querySelectorAll('#tabs [data-t]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  render();
});
function load() {
  return api('/giochi/admin/utenti').then(function (j) {
    utenti = j.utenti; $('#login').hidden = true; $('#panel').hidden = false; $('#hBtns').hidden = false;
    var n = utenti.filter(function (u) { return u.stato === 'in_attesa'; }).length;
    var ns = utenti.filter(function (u) { return u.sospetto; }).length;
    $('#sosp').hidden = !ns; $('#sosp').innerHTML = ns ? '<span>⚠ ' + (ns === 1 ? '1 account prova' : ns + ' account provano') + ' a entrare da più dispositivi del permesso: forse la password è stata data ad altri. Li trovi in cima alla lista, segnati.</span>' : '';
    document.title = (n ? '(' + n + ') ' : '') + 'Leggo e Conto · Backoffice';
    $('#alert').hidden = !n;
    $('#alert').innerHTML = n ? '<span>' + (n === 1 ? 'C\u2019è 1 richiesta d\u2019accesso da approvare' : 'Ci sono ' + n + ' richieste d\u2019accesso da approvare') + '</span><button class="btn" id="goWait">Vedi</button>' : '';
    if (n) $('#goWait').onclick = function () { document.querySelector('#tabs [data-t="in_attesa"]').click(); };
    render();
  }).catch(function (x) {
    if (x.status === 401 || x.status === 403) { $('#out').onclick(); msg(x.status === 403 ? 'Questo account non è l’amministratore' : 'Rientra con la password'); }
    else msg('Non riesco a collegarmi al server');
  });
}
// il piano: sociale (gratis, senza scadenza), prova, base, premium; scaduto si conta a parte
var PIANO = { sociale: 'Sociale', prova: 'Prova', base: 'Base', premium: 'Premium' };
function giorno(t) { return t ? new Date(t).toLocaleDateString('it-IT') : 'senza scadenza'; }
function gruppo(u) { return u.stato === 'attivo' && u.scaduto ? 'scaduto' : u.stato; }
function card(u) {
  var kids = u.bambini.length ? '<ul class="kids">' + u.bambini.map(function (k) { return '<li>' + esc(k.nome) + (k.classe ? ', ' + esc(k.classe) : '') + (k.eta ? ', ' + esc(k.eta) + ' anni' : '') + ' · ' + k.partite + ' partite · ' + k.stelline + ' stelline</li>'; }).join('') + '</ul>' : '<p class="empty" style="margin:6px 0 0">Nessun bambino ancora</p>';
  var a = [];
  if (u.stato !== 'attivo') a.push('<button class="btn ok" data-a="approva" data-id="' + u.id + '">' + (u.stato === 'bloccato' ? 'Riattiva' : 'Approva') + '</button>');
  if (u.stato !== 'bloccato') a.push('<button class="btn stop" data-a="blocca" data-id="' + u.id + '">' + (u.stato === 'in_attesa' ? 'Rifiuta' : 'Blocca') + '</button>');
  if (u.piano !== 'sociale') a.push('<button class="btn ok" data-a="sociale" data-id="' + u.id + '">Rendi sociale (gratis)</button>');
  if (u.piano === 'prova' || u.scaduto) a.push('<button class="btn" data-a="prova30" data-id="' + u.id + '">Prova +30 giorni</button>');
  if (u.dispositivi) a.push('<button class="btn" data-a="scollega-tutti" data-id="' + u.id + '">Scollega tutti i dispositivi</button>');
  a.push('<button class="btn" data-a="pw" data-id="' + u.id + '">' + (pwArm[u.id] === 1 ? 'Tocca ancora: la password vecchia non vale più' : 'Password provvisoria') + '</button>');
  a.push('<button class="btn" data-a="del" data-id="' + u.id + '">' + (delArm[u.id] ? 'Tocca ancora: si cancellano anche i bambini' : 'Elimina') + '</button>');
  return '<div class="card"><div class="u-top"><span class="u-name">' + esc(u.nome || u.email) + '</span><span class="chip st-' + u.stato + '">' + { in_attesa: 'da approvare', attivo: 'attivo', bloccato: 'bloccato' }[u.stato] + '</span><span class="chip pl-' + (u.scaduto ? 'scaduto' : u.piano) + '">' + (PIANO[u.piano] || u.piano) + (u.scaduto ? ' · scaduto' : '') + '</span>' + (u.sospetto ? '<span class="chip sosp">⚠ possibile condivisione</span>' : '') + '</div>'
    + '<p class="piano">Piano <b>' + esc(PIANO[u.piano] || u.piano) + '</b> · ' + (u.scadenza ? (u.scaduto ? 'scaduto il ' : 'fino al ') + giorno(u.scadenza) : 'senza scadenza') + (u.odoo ? ' · abbonamento Odoo ' + esc(u.odoo) : '') + '</p>'
    + '<p class="piano">Dispositivi collegati <b>' + u.dispositivi + ' di ' + u.max_dispositivi + '</b>' + (u.tentativi_oltre ? ' · tentativi da un dispositivo in più: <b>' + u.tentativi_oltre + '</b>' : '') + '</p>'
    + (u.messaggio ? '<p style="margin:6px 0 0">«' + esc(u.messaggio) + '»</p>' : '')
    + '<div class="meta"><span>Email: <b>' + esc(u.email) + '</b></span><span>Telefono: <b>' + esc(u.telefono || '–') + '</b></span><span>Richiesta: <b>' + when(u.iscritto) + '</b></span><span>Approvato: <b>' + when(u.approvato) + '</b></span><span>Ultimo accesso: <b>' + when(u.ultimo_accesso) + '</b></span><span>Accessi: <b>' + u.accessi + '</b></span></div>'
    + kids + '<div class="acts">' + a.join('') + '</div>'
    + (typeof pwArm[u.id] === 'string' ? '<p class="pw">Password provvisoria da comunicare: <code>' + esc(pwArm[u.id]) + '</code></p>' : '') + '</div>';
}
function render() {
  ['in_attesa', 'attivo', 'scaduto', 'bloccato'].forEach(function (s) { $('#n-' + s).textContent = utenti.filter(function (u) { return gruppo(u) === s; }).length; });
  $('#acc').hidden = tab !== 'accessi'; $('#odoo').hidden = tab !== 'odoo'; $('#list').hidden = tab === 'accessi' || tab === 'odoo';
  if (tab === 'odoo') return renderOdoo();
  if (tab === 'accessi') {
    $('#acc').innerHTML = '<p class="empty">Carico...</p>';
    api('/giochi/admin/accessi?limite=300').then(function (j) {
      $('#acc').innerHTML = j.accessi.length ? '<table><thead><tr><th>Quando</th><th>Chi</th><th>Dispositivo</th></tr></thead><tbody>' + j.accessi.map(function (a) { return '<tr><td>' + when(a.quando) + '</td><td>' + esc(a.nome || '') + '<br><span class="empty">' + esc(a.email) + '</span></td><td class="empty">' + esc((a.dispositivo || '–').slice(0, 90)) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="empty">Nessun accesso ancora.</p>';
    }).catch(function (x) { $('#acc').innerHTML = '<p class="msg">' + esc(x.message) + '</p>'; });
    return;
  }
  var l = utenti.filter(function (u) { return gruppo(u) === tab; }).sort(function (x, y) { return (y.sospetto ? 1 : 0) - (x.sospetto ? 1 : 0); });
  $('#list').innerHTML = l.length ? l.map(card).join('') : '<p class="empty">' + { in_attesa: 'Nessuna richiesta da approvare.', attivo: 'Nessun accesso attivo.', scaduto: 'Nessun abbonamento scaduto.', bloccato: 'Nessun accesso bloccato.' }[tab] + '</p>';
}
// il collegamento con Odoo: cosa e' configurato su Render e gli avvisi arrivati
function renderOdoo() {
  $('#odoo').innerHTML = '<p class="empty">Carico...</p>';
  api('/giochi/admin/odoo').then(function (j) {
    var si = function (v, t) { return '<li>' + (v ? '✅ ' : '⚠️ ') + t + '</li>'; };
    $('#odoo').innerHTML = '<h2 style="margin:0 0 8px">Collegamento con Odoo</h2><ul class="check">'
      + si(j.chiave, j.chiave ? 'Chiave degli avvisi impostata (GIOCHI_ODOO_CHIAVE).' : 'Manca GIOCHI_ODOO_CHIAVE su Render: senza, gli avvisi di Odoo vengono rifiutati.')
      + si(j.lettura, j.lettura ? 'Il server legge gli abbonamenti da Odoo (ODOO_URL, ODOO_DB, ODOO_UTENTE, ODOO_CHIAVE).' : 'Il server non legge ancora gli abbonamenti da Odoo: mancano ODOO_URL, ODOO_DB, ODOO_UTENTE, ODOO_CHIAVE su Render.')
      + si(j.negozio, j.negozio ? 'Pagina del negozio: ' + esc(j.negozio) : 'Manca GIOCHI_NEGOZIO_URL: l’app non mostra il pulsante «Abbonati sul sito».')
      + si(j.posta, j.posta ? 'La posta parte: chi compra riceve il link per la password.' : 'La posta non è configurata: chi compra NON riceve il link. Dagli tu una password provvisoria.')
      + '</ul><p>Indirizzo da incollare in Odoo (azione «Invia notifica webhook»):<br><code class="url">' + esc(API) + '/giochi/odoo/abbonamento?chiave=LA-TUA-CHIAVE</code></p>'
      + '<h2 style="margin:16px 0 8px">Ultimi avvisi da Odoo</h2>'
      + (j.eventi.length ? '<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Email</th><th>Abbonamento</th><th>Esito</th></tr></thead><tbody>' + j.eventi.map(function (e) { return '<tr><td>' + when(e.quando) + '</td><td>' + esc(e.email || '–') + '</td><td>' + esc(e.rif || '–') + '</td><td>' + esc(e.esito) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="empty">Nessun avviso arrivato finora.</p>');
  }).catch(function (x) { $('#odoo').innerHTML = '<p class="msg">' + esc(x.message) + '</p>'; });
}
$('#list').addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return;
  var id = b.dataset.id, a = b.dataset.a;
  if (a === 'pw' && pwArm[id] !== 1) { pwArm[id] = 1; return render(); }
  if (a === 'del' && !delArm[id]) { delArm[id] = 1; return render(); }
  b.disabled = true;
  var call = a === 'del' ? api('/giochi/admin/utenti/' + id, { method: 'DELETE' })
    : a === 'pw' ? api('/giochi/admin/utenti/' + id + '/password-provvisoria', { method: 'POST' }).then(function (j) { pwArm[id] = j.password; })
    : a === 'sociale' ? api('/giochi/admin/utenti/' + id + '/piano', { method: 'POST', body: JSON.stringify({ piano: 'sociale' }) })
    : a === 'prova30' ? api('/giochi/admin/utenti/' + id + '/piano', { method: 'POST', body: JSON.stringify({ piano: 'prova', giorni: 30 }) })
    : api('/giochi/admin/utenti/' + id + '/' + a, { method: 'POST' });   // approva, blocca, scollega-tutti
  call.then(function () { delete delArm[id]; if (a !== 'pw') delete pwArm[id]; return load(); })
    .catch(function (x) { b.disabled = false; alert('Non riuscito: ' + x.message); });
});
function mailInfo() {
  api('/giochi/admin/posta').then(function (j) {
    $('#mailInfo').textContent = j.configurata ? 'Gli avvisi via email sono attivi: le richieste nuove arrivano a ' + j.destinatario + '.' : 'Gli avvisi via email non sono ancora attivi (manca la casella di posta su Render). Le richieste nuove si vedono qui, e la pagina si aggiorna da sola ogni minuto.';
  }).catch(function () {});
}
// la pagina aperta controlla da sola ogni minuto se sono arrivate richieste
setInterval(function () { if (tok && !document.hidden) load(); }, 60000);
var _load = load; load = function () { var r = _load(); mailInfo(); return r; };
// password dimenticata: link via email; il link riporta qui con ?recupero=
var recCode = null; try { var m = location.search.match(/[?&]recupero=([^&#]+)/); if (m) recCode = decodeURIComponent(m[1]); } catch (e) {}
$('#lost').onclick = function () {
  var em = $('#em').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return msg('Scrivi prima la tua email qui sopra, poi tocca di nuovo «Password dimenticata?»');
  msg('Invio...');
  api('/auth/recupero', { method: 'POST', body: JSON.stringify({ email: em, dove: 'backoffice' }) }).then(function (r) {
    msg(r.posta ? 'Se l\u2019email è quella dell\u2019amministratore, ti è arrivato un link: aprilo entro un\u2019ora.' : 'L\u2019invio delle email non è ancora attivo. Per rientrare: su Render, servizio diario-salute-api, scheda Environment, aggiungi ADMIN_NUOVA_PASSWORD con la password che vuoi; dopo il riavvio entra con quella e poi cancella la variabile.');
  }).catch(function (x) { msg(x.status ? x.message : 'Non riesco a collegarmi al server'); });
};
$('#nuova').addEventListener('submit', function (e) {
  e.preventDefault();
  var n = $('#np1').value, nm = function (t) { $('#nmsg').textContent = t; $('#nmsg').hidden = !t; };
  if (n.length < 8) return nm('La password deve avere almeno 8 caratteri');
  if (n !== $('#np2').value) return nm('Le due password non sono uguali');
  nm('Salvo...');
  api('/auth/recupero/conferma', { method: 'POST', body: JSON.stringify({ codice: recCode, nuova: n }) }).then(function (r) {
    recCode = null; try { history.replaceState(null, '', location.pathname); } catch (x) {}
    $('#nuova').hidden = true; $('#login').hidden = false; $('#em').value = r.email || ''; msg('Password cambiata: entra con quella nuova.');
  }).catch(function (x) { nm(x.status ? x.message : 'Non riesco a collegarmi al server'); });
});
if (recCode) { $('#login').hidden = true; $('#nuova').hidden = false; }
else if (tok) load();
</script>
<script>
/* occhio sulle password e email sempre minuscole, su ogni campo della pagina */
(function () {
  var APERTO = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var CHIUSO = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
  function occhio(inp) {
    if (inp.dataset.occhio) return; inp.dataset.occhio = '1';
    var w = document.createElement('span'); w.style.cssText = 'position:relative;display:block;width:100%';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp); inp.style.paddingRight = '52px';
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Mostra la password');
    b.style.cssText = 'position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:8px;cursor:pointer;color:inherit;line-height:0;box-shadow:none;min-width:0';
    b.innerHTML = APERTO;
    b.onclick = function () { var vedi = inp.type === 'password'; inp.type = vedi ? 'text' : 'password'; b.innerHTML = vedi ? CHIUSO : APERTO; b.setAttribute('aria-label', vedi ? 'Nascondi la password' : 'Mostra la password'); inp.focus(); };
    w.appendChild(b);
  }
  function minuscola(inp) {
    if (inp.dataset.minuscola) return; inp.dataset.minuscola = '1';
    inp.setAttribute('autocapitalize', 'none'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('spellcheck', 'false');
    inp.addEventListener('input', function () {
      var v = inp.value.toLowerCase().replace(/\s+/g, '');
      if (v !== inp.value) { var p = null; try { p = inp.selectionStart; } catch (e) {} inp.value = v; try { if (p != null) inp.setSelectionRange(p, p); } catch (e) {} }
    });
  }
  var attesa = false;
  function cerca() { attesa = false; document.querySelectorAll('input[type=password]').forEach(occhio); document.querySelectorAll('input[type=email],input[inputmode=email]').forEach(minuscola); }
  cerca();
  new MutationObserver(function () { if (!attesa) { attesa = true; requestAnimationFrame(cerca); } }).observe(document.body, { childList: true, subtree: true });
})();
</script>
