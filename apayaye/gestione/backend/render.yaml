# Blueprint Render per il backend della gestione Apayaye.
# Database Neon (PostgreSQL, regione UE): la stringa di connessione va in DATABASE_URL.
services:
  - type: web
    name: apayaye-api
    runtime: docker
    rootDir: apayaye/gestione/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://lagiostradellavita.github.io
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
