<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d7ea6">
<title>Gestione Apayaye</title>
<link rel="manifest" href="gestione.manifest.json">
<link rel="icon" href="apayaye-512.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="apayaye-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    color-scheme:light;
    --ink:#1f2a33; --soft:#5a6a76; --line:#dce5ea; --bg:#eef3f6; --panel:#fff;
    --mare:#1d7ea6; --mare-scuro:#145d79; --verde:#3e8f3f; --rosso:#c0392b; --ambra:#b9770e;
    --giallo:#fdf3cf;
    --f:"Nunito",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f);color:var(--ink);background:var(--bg);font-size:15px}
  a{color:var(--mare)}
  .topbar{background:linear-gradient(90deg,#1d7ea6,#145d79);color:#fff;padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .topbar b{font-weight:800;font-size:1.1rem}
  .topbar .who{font-size:.86rem;opacity:.95;display:flex;gap:10px;align-items:center}
  .btn{border:0;border-radius:9px;padding:9px 14px;font-family:var(--f);font-weight:700;font-size:.9rem;cursor:pointer}
  .btn.p{background:var(--mare);color:#fff}
  .btn.g{background:#eef3f6;color:var(--ink);border:1px solid var(--line)}
  .btn.d{background:var(--rosso);color:#fff}
  .btn.v{background:var(--verde);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:6px 10px;font-size:.82rem}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .layout{display:grid;grid-template-columns:200px 1fr;gap:18px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  nav.side{display:flex;flex-direction:column;gap:4px}
  @media(max-width:760px){nav.side{flex-direction:row;flex-wrap:wrap}}
  nav.side button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;
    font-family:var(--f);font-weight:700;color:var(--soft);cursor:pointer}
  nav.side button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h1{font-size:1.3rem;margin:.1em 0 .4em}
  h2{font-size:1.05rem;margin:.2em 0 .6em}
  .muted{color:var(--soft)}
  label{display:block;font-weight:700;font-size:.82rem;margin:10px 0 3px;color:var(--soft)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:var(--f);font-size:.95rem;background:#fff}
  input:focus,select:focus{outline:2px solid #bfe0ee;border-color:var(--mare)}
  /* Tabelle: stile "foglio" (come l'app contabilità) */
  .scroll{overflow-x:auto;border:1px solid #d6dde2;border-radius:12px;box-shadow:0 1px 3px rgba(20,40,55,.07);background:#fff}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  thead th{background:#263038;color:#fff;font-weight:700;text-transform:none;letter-spacing:0;
    font-size:.82rem;text-align:left;padding:11px 12px;white-space:nowrap;border-bottom:0}
  thead th:first-child{border-top-left-radius:11px}
  thead th:last-child{border-top-right-radius:11px}
  tbody td{text-align:left;padding:9px 12px;border-bottom:1px solid #eef1f3;white-space:nowrap;color:var(--ink)}
  tbody td:first-child{font-weight:700;color:#1f2a30}
  tbody tr:nth-child(even) td{background:#f3f6f8}
  tbody tr:hover td{background:#e7f0f5}
  tbody tr:last-child td{border-bottom:0}
  tr.verifica td, tbody tr.verifica:nth-child(even) td{background:var(--giallo)}
  tr.verifica:hover td{background:#fbeeb8}
  td.nota{white-space:normal;max-width:240px;line-height:1.25;font-weight:400;color:var(--ink)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700}
  .pill.ok{background:#e4f2e4;color:var(--verde)} .pill.no{background:#fbe6e3;color:var(--rosso)}
  .pill.att{background:var(--giallo);color:var(--ambra)}
  .msg{padding:10px 13px;border-radius:10px;margin:10px 0;font-weight:700;font-size:.9rem}
  .msg.err{background:#fbe6e3;color:var(--rosso)} .msg.ok{background:#e4f2e4;color:var(--verde)}
  .msg.inf{background:#e7f0f5;color:var(--mare-scuro)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:150px}
  .login{max-width:380px;margin:8vh auto;padding:26px}
  .login h1{text-align:center}
  .right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .hidden{display:none}
  .mini{font-size:.8rem;color:var(--soft)}
  code{background:#eef3f6;padding:1px 5px;border-radius:5px;font-size:.85em}
  ul.chk{list-style:none;padding:0;margin:0}
  ul.chk li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  ul.chk li .chi{margin-left:auto;font-size:.78rem;color:var(--soft);white-space:nowrap}
  /* Rendicontazione */
  .rc-band{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#263038;color:#fff;border-radius:12px;padding:12px 16px;margin:-2px 0 12px}
  .rc-band h1{margin:0;font-size:1.2rem;color:#fff}
  .rc-band span{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  .rc-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .rc-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(20,40,55,.05)}
  .rc-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;border:0;background:#fff;text-align:left;font-family:var(--f)}
  .rc-head:hover{background:#f6f9fb}
  .rc-check{width:26px;height:26px;border-radius:50%;background:#e4f2ec;color:var(--verde);display:grid;place-items:center;font-weight:800;flex:0 0 auto;font-size:.9rem}
  .rc-tit{flex:1;min-width:0}
  .rc-tit b{font-size:.98rem}
  .rc-chip{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .rc-chip.ufficio{background:#e7f0f5;color:var(--mare-scuro)}
  .rc-chip.operatore{background:#fde4d6;color:var(--ambra)}
  .rc-chip.misto{background:#eee9f6;color:#6b4fae}
  .rc-caret{transition:transform .2s;color:var(--soft);flex:0 0 auto;font-size:1.3rem;line-height:1}
  .rc-item.open .rc-caret{transform:rotate(90deg)}
  .rc-body{padding:2px 14px 14px;display:none}
  .rc-item.open .rc-body{display:block}
  .rc-link{color:var(--mare);font-weight:700;text-decoration:none;white-space:nowrap;border:0;background:none;font-family:var(--f);font-size:.86rem;cursor:pointer;padding:0}
  .rc-link:hover{text-decoration:underline}
  .rc-tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:7px;background:#eef2f4;color:var(--soft)}
  .rc-tag.modello{background:#e4f2ec;color:var(--verde)}
  .rc-tag.cartella{background:#e7f0f5;color:var(--mare-scuro)}
  .rc-tag.app{background:#efe7f6;color:#6b4fae}
  .rc-files{margin-top:10px}
  .rc-filesec{margin-top:10px}
  .rc-filehead{font-weight:700;font-size:.82rem;color:var(--ink)}
  .rc-filelist{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
  .rc-filelist li{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;line-height:1.3}
  .rc-fico{flex:0 0 auto}
  .rc-filelist a{color:var(--mare);text-decoration:none;word-break:break-word}
  .rc-filelist a:hover{text-decoration:underline}
  .tag{font-size:.72rem;background:#eef3f6;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--soft)}
  .ver{font-size:.72rem;font-weight:400;opacity:.85;margin-left:8px}
  .tb-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .aggbtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 10px;font-family:var(--f);font-weight:700;font-size:.78rem;cursor:pointer}
  .aggbtn.nuovo{background:var(--ambra);border-color:var(--ambra);animation:pulsa 1.3s infinite}
  .spunta{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--ink);margin:9px 0}
  .spunta input{width:auto;margin:0}
  @keyframes pulsa{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-left"><img src="apayaye-mark.png" alt="Apayaye" style="height:24px;width:auto;vertical-align:middle;margin-right:8px"><b>Gestione Apayaye</b><span class="ver" id="ver"></span><button class="aggbtn" id="aggiorna" title="Aggiorna all'ultima versione">↻ Aggiorna</button></div>
  <div class="who" id="who"></div>
</div>

<!-- LOGIN -->
<div id="vista-login" class="wrap">
  <div class="card login">
    <h1>Area riservata</h1>
    <p class="muted" style="text-align:center;margin-top:-6px">Progetto Apayaye · accesso per ufficio e operatori</p>
    <div id="login-msg"></div>
    <label>Email</label>
    <input id="l-email" type="email" autocomplete="username" placeholder="nome@esempio.it">
    <label>Password</label>
    <input id="l-pwd" type="password" autocomplete="current-password" placeholder="La tua password">
    <div style="margin-top:16px"><button class="btn p" id="l-go" style="width:100%">Entra</button></div>
    <details style="margin-top:14px"><summary class="mini">Impostazioni avanzate</summary>
      <label>Indirizzo del server (API)</label>
      <input id="l-api" type="text" placeholder="https://apayaye-api-ggr3.onrender.com">
      <p class="mini">Si cambia solo se il server ha un altro indirizzo.</p>
    </details>
  </div>
</div>

<!-- APP -->
<div id="vista-app" class="wrap hidden">
  <div class="layout">
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<footer style="max-width:980px;margin:26px auto 30px;padding:16px;text-align:center;border-top:1px solid #d7e0e6;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap">
  <img src="logo-giostra.png" alt="La Giostra della Vita" style="height:50px;width:auto">
  <span style="color:#5a6b74;font-size:.9rem">Un progetto di <b>La Giostra della Vita</b> · Cooperativa Sociale</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
var APP_VERSION = "2.8";
var LS = {
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var API = LS.get("apayaye.gestione.api") || "https://apayaye-api-ggr3.onrender.com";
var token = LS.get("apayaye.gestione.token") || "";
var ruolo = LS.get("apayaye.gestione.ruolo") || "";
var email = LS.get("apayaye.gestione.email") || "";

function $(id){return document.getElementById(id)}
try{ $("ver").textContent = "v"+APP_VERSION; }catch(e){}
function ricaricaUltima(){ try{ location.replace(location.pathname + "?r=" + Date.now()); }catch(e){ location.reload(); } }
function controllaAggiornamenti(){
  fetch(location.pathname + "?c=" + Date.now(), {cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
    var m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    var b = $("aggiorna");
    if(m && b && m[1] !== APP_VERSION){ b.textContent = "↻ Aggiorna a v"+m[1]; b.className = "aggbtn nuovo"; }
  }).catch(function(){});
}
try{ $("aggiorna").addEventListener("click", ricaricaUltima); }catch(e){}
setTimeout(controllaAggiornamenti, 3000); setInterval(controllaAggiornamenti, 120000);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function normTxt(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

async function api(path, opt){
  opt = opt || {};
  var h = {"Content-Type":"application/json"};
  if(opt.auth !== false && token) h["Authorization"] = "Bearer " + token;
  var res, tent = 0;
  while(true){
    try{
      res = await fetch(API + path, {method: opt.method||"GET", headers:h,
        body: opt.body ? JSON.stringify(opt.body) : undefined});
      break;
    }catch(e){
      tent++;
      if(tent >= 7) throw new Error("Server non raggiungibile dopo vari tentativi. Il server gratuito potrebbe essere spento: apri https://apayaye-api-ggr3.onrender.com/health e riprova.");
      await new Promise(function(rs){ setTimeout(rs, 9000); });
    }
  }
  if(res.status === 401){ logout(); throw new Error("Sessione scaduta: rientra."); }
  var dati = null;
  try{ dati = await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((dati && dati.detail) ? dati.detail : ("Errore "+res.status)); }
  return dati;
}

/* ---------- login ---------- */
$("l-api").value = API === "https://apayaye-api-ggr3.onrender.com" ? "" : API;
$("l-go").addEventListener("click", login);
$("l-pwd").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });
async function login(){
  var a = $("l-api").value.trim();
  if(a){ API = a.replace(/\/+$/,""); LS.set("apayaye.gestione.api", API); }
  var m = $("login-msg"); m.innerHTML = "";
  var em = $("l-email").value.trim(), pw = $("l-pwd").value;
  if(!em || !pw){ m.innerHTML = '<div class="msg err">Scrivi email e password.</div>'; return; }
  $("l-go").disabled = true; $("l-go").textContent = "Entro…";
  try{
    var r = await api("/auth/login", {method:"POST", auth:false, body:{email:em, password:pw}});
    token = r.token; ruolo = r.ruolo; email = em;
    LS.set("apayaye.gestione.token", token); LS.set("apayaye.gestione.ruolo", ruolo); LS.set("apayaye.gestione.email", em);
    avviaApp();
  }catch(e){ m.innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
  $("l-go").disabled = false; $("l-go").textContent = "Entra";
}
function logout(){
  token=""; ruolo=""; LS.del("apayaye.gestione.token"); LS.del("apayaye.gestione.ruolo");
  $("vista-app").classList.add("hidden"); $("vista-login").classList.remove("hidden");
  $("who").innerHTML=""; $("l-pwd").value="";
}

/* ---------- navigazione ---------- */
var VOCI = [
  {id:"minori", et:"Minori", ruoli:["ufficio","admin"]},
  {id:"importa", et:"Importa Excel", ruoli:["ufficio","admin"]},
  {id:"export", et:"Export ReGiS", ruoli:["ufficio","admin"]},
  {id:"rendic", et:"Rendicontazione", ruoli:["ufficio","admin","operatore"]},
  {id:"timbratura", et:"Timbratura", ruoli:["operatore"]},
  {id:"figli", et:"I miei figli", ruoli:["genitore"]},
  {id:"attivita", et:"Attività e ore", ruoli:["ufficio","admin","operatore"]},
  {id:"documenti", et:"Documenti", ruoli:["ufficio","admin","operatore"]},
  {id:"indicatori", et:"Indicatori", ruoli:["ufficio","admin"]},
  {id:"operatori", et:"Operatori", ruoli:["ufficio","admin"]},
  {id:"catalogo", et:"Catalogo", ruoli:["ufficio","admin"]},
  {id:"utenti", et:"Utenti e accessi", ruoli:["admin"]}
];
var vistaCorr = "minori";

function avviaApp(){
  $("vista-login").classList.add("hidden"); $("vista-app").classList.remove("hidden");
  $("who").innerHTML = esc(email) + ' <span class="tag">'+esc(ruolo)+'</span> '+
    '<button class="btn g sm" id="b-logout">Esci</button>';
  $("b-logout").addEventListener("click", logout);
  var voci = VOCI.filter(function(v){ return v.ruoli.indexOf(ruolo) >= 0; });
  if(voci.length && voci.map(function(v){return v.id}).indexOf(vistaCorr) < 0) vistaCorr = voci[0].id;
  $("nav").innerHTML = voci.map(function(v){
    return '<button data-v="'+v.id+'" class="'+(v.id===vistaCorr?"on":"")+'">'+esc(v.et)+'</button>';
  }).join("");
  Array.prototype.forEach.call($("nav").querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){ vistaCorr = b.getAttribute("data-v"); avviaApp(); });
  });
  render();
}

function render(){
  var m = $("main");
  if(vistaCorr==="minori") return vistaMinori(m);
  if(vistaCorr==="importa") return vistaImporta(m);
  if(vistaCorr==="export") return vistaExport(m);
  if(vistaCorr==="rendic") return vistaRendic(m);
  if(vistaCorr==="indicatori") return vistaIndicatori(m);
  if(vistaCorr==="operatori") return vistaOperatori(m);
  if(vistaCorr==="timbratura") return vistaTimbratura(m);
  if(vistaCorr==="figli") return vistaFigli(m);
  if(vistaCorr==="catalogo") return vistaCatalogo(m);
  if(vistaCorr==="utenti") return vistaUtenti(m);
  if(vistaCorr==="attivita") return vistaAttivita(m);
  if(vistaCorr==="documenti") return vistaDocumenti(m);
}

/* ---------- INDICATORI ReGiS ---------- */
async function vistaIndicatori(m){
  m.innerHTML='<div class="card"><h1>Indicatori ReGiS</h1><p class="muted">Conteggi dei minori beneficiari, ricavati dalla data di nascita (fascia) e dal genere. I minori rinunciatari non contano.</p><div id="ind-body" class="muted">Carico\u2026</div></div>';
  var d; try{ d=await api("/indicatori"); }catch(e){ $("ind-body").innerHTML='<div class="msg inf">'+esc(e.message)+'</div>'; return; }
  function tab(obj){ return '<div class="scroll"><table><thead><tr><th></th><th>Femmine</th><th>Maschi</th><th>Totale</th></tr></thead><tbody><tr><td>minori</td><td>'+obj.F+'</td><td>'+obj.M+'</td><td><b>'+obj.tot+'</b></td></tr></tbody></table></div>'; }
  var h='<div class="row" style="gap:12px">'+
    '<div class="card" style="flex:1;text-align:center;min-width:150px"><div class="mini">Totale beneficiari</div><div style="font-size:1.9rem;font-weight:800;color:var(--mare)">'+d.totale_beneficiari+'</div></div>'+
    '<div class="card" style="flex:1;text-align:center;min-width:150px"><div class="mini">T0158 \u2014 minori supportati (cumulato)</div><div style="font-size:1.9rem;font-weight:800;color:var(--mare)">'+d.T0158+'</div></div></div>'+
    '<div class="card"><h2>C10 \u2014 minori 11-17 che ricevono istruzione/formazione</h2>'+tab(d.C10)+'</div>'+
    '<div class="card"><h2>C14 \u2014 minori 15-17 che ricevono sostegno</h2>'+tab(d.C14)+'</div>'+
    '<div class="card"><h2>Per fascia d\'et\u00e0</h2><div class="scroll"><table><thead><tr><th>Fascia</th><th>Femmine</th><th>Maschi</th><th>Totale</th></tr></thead><tbody>';
  [["11-14","11-14 anni"],["15-17","15-17 anni"],["fuori","Fuori 11-17"],["senza_data","Senza data di nascita"]].forEach(function(p){ var o=d.per_fascia[p[0]]; h+='<tr><td>'+p[1]+'</td><td>'+o.F+'</td><td>'+o.M+'</td><td><b>'+o.tot+'</b></td></tr>'; });
  h+='</tbody></table></div>';
  if(d.fuori_fascia||d.senza_data){ h+='<p class="mini" style="margin-top:8px">\u26a0 '+(d.fuori_fascia?d.fuori_fascia+' fuori dalla fascia 11-17. ':'')+(d.senza_data?d.senza_data+' senza data di nascita (controlla il codice fiscale).':'')+'</p>'; }
  if(d.rinunciatari){ h+='<p class="mini">'+d.rinunciatari+' rinunciatari (esclusi dai conteggi).</p>'; }
  h+='</div>';
  $("ind-body").innerHTML=h;
}
/* ---------- CATALOGO (incarichi + scuole) ---------- */
var catDati=null;
var RUOLI=["Animatore","Tutor","Esperto","Formatore"];
function optSel(valori, sel, vuoto){
  var h = vuoto!=null ? '<option value="">'+esc(vuoto)+'</option>' : '';
  return h + valori.map(function(v){ return '<option'+(String(v)===String(sel||"")?' selected':'')+'>'+esc(v)+'</option>'; }).join("");
}
function catMsg(t,cls){ var e=$("cat-msg"); if(e) e.innerHTML='<div class="msg '+(cls||"inf")+'">'+esc(t)+'</div>'; }
async function vistaCatalogo(m){
  m.innerHTML='<div class="card"><h1>Catalogo del progetto</h1><p class="muted">Incarichi (ruoli e tariffe) e scuole: sono il riferimento per timbrature, Allegato G e ricevute.</p><div id="cat-msg"></div></div><div id="cat-inc" class="muted">Carico…</div><div id="cat-sc"></div>';
  try{ catDati=await api("/catalogo"); }catch(e){ $("cat-inc").innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; return; }
  disegnaIncarichi(); disegnaScuole();
}
function rigaInc(x){
  x=x||{};
  return '<tr data-id="'+(x.id||"")+'">'+

function docABase64(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result)); }; r.onerror=function(){ rej(new Error("file non leggibile")); }; r.readAsDataURL(f); }); }
async function caricaDoc(){
  var files=$("doc-file").files;
  if(!files || !files.length){ docMsg("Scegli uno o più file.","err"); return; }
  var tipo=$("doc-tipo").value, periodo=$("doc-periodo").value||null, btn=$("doc-carica");
  btn.disabled=true;
  var ok=0, errori=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>10*1024*1024){ errori.push(esc(f.name)+": troppo grande (max 10 MB)"); continue; }
    docMsg("Carico "+(i+1)+" di "+files.length+"\u2026","inf");
    try{
      var b64=await docABase64(f);
      await api("/presenze/documento",{method:"POST",body:{tipo:tipo, titolo:f.name, periodo:periodo, nome_file:f.name, mime:f.type||null, contenuto_base64:b64}});
      ok++;
    }catch(e){ errori.push(esc(f.name)+": "+esc(e.message)); }
  }
  btn.disabled=false; $("doc-file").value="";
  docMsg("Caricati "+ok+" file"+(errori.length?" \u00b7 "+errori.length+" non riusciti ("+errori.join("; ")+")":"")+".", errori.length?"err":"ok");
  caricaListaDoc();
}
async function apriDoc(id){

    var blob=await res.blob(), url=URL.createObjectURL(blob);
    window.open(url,"_blank"); setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }catch(e){ docMsg(e.message,"err"); }
}
async function elimDoc(id){
  if(!window.confirm("Eliminare questo documento?")) return;
  try{ await api("/presenze/documento/"+id,{method:"DELETE"}); caricaListaDoc(); }catch(e){ docMsg(e.message,"err"); }
}

function generaAllegatoG(mese, op, righe){
  op=op||(timbCtx&&timbCtx.operatore)||{}; righe=righe||timbMese(mese);
  if(!righe.length){ (window.opTimbMsg||tbMsg)("Nessuna timbratura chiusa in "+mese+".","err"); return; }
  righe.sort(function(a,b){ return String(a.entrata).localeCompare(String(b.entrata)); });
  var tot=0, body="";
  righe.forEach(function(t){ tot+=Number(t.ore)||0;
    body+='<tr><td>'+esc(soloData(t.entrata))+'</td><td>'+esc(soloOra(t.entrata))+'</td><td>'+esc(soloOra(t.uscita))+'</td><td>'+(t.ore!=null?t.ore:"")+'</td><td>'+esc(t.incarico||"")+'</td><td>'+esc(t.scuola||"")+'</td></tr>';
  });
  var nomeMese=new Date(mese+"-01").toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  var h='<h1>Allegato G — Timesheet mensile</h1>'+intestazioneProgetto()+
    '<div class="box"><b>Operatore:</b> '+esc((op.cognome||"")+" "+(op.nome||""))+(op.codice_fiscale?' · C.F. '+esc(op.codice_fiscale):'')+'<br><b>Mese:</b> '+esc(nomeMese)+'</div>'+
    '<table><thead><tr><th>Giorno</th><th>Entrata</th><th>Uscita</th><th>Ore</th><th>Attività / incarico</th><th>Sede</th></tr></thead><tbody>'+body+
    '<tr class="tot"><td colspan="3">Totale ore</td><td>'+tot.toFixed(2).replace(".",",")+'</td><td colspan="2"></td></tr></tbody></table>'+
    '<p class="muted" style="margin-top:10px">Le ore sono calcolate dalle timbrature di entrata e uscita registrate nell’app.</p>'+
    '<div class="firma"><div>Data ____________________</div><div>Firma dell’operatore ________________________</div></div>';
  stampaFinestra("Allegato G "+mese, h);
}
function generaRicevuta(mese, op, righe){
  op=op||(timbCtx&&timbCtx.operatore)||{}; righe=righe||timbMese(mese);
  if(!righe.length){ (window.opTimbMsg||tbMsg)("Nessuna timbratura chiusa in "+mese+".","err"); return; }
  var perInc={}, senzaTariffa=0, totOre=0;
  righe.forEach(function(t){ var ore=Number(t.ore)||0; totOre+=ore;
    if(t.tariffa==null){ senzaTariffa+=ore; return; }
    var k=(t.incarico||"")+"|"+t.tariffa; if(!perInc[k]) perInc[k]={incarico:t.incarico||"", tariffa:Number(t.tariffa), ore:0}; perInc[k].ore+=ore;
  });
  var lordo=0, body="";
  Object.keys(perInc).forEach(function(k){ var r=perInc[k], imp=r.ore*r.tariffa; lordo+=imp;
    body+='<tr><td>'+esc(r.incarico)+'</td><td>'+r.ore.toFixed(2).replace(".",",")+'</td><td>'+eur(r.tariffa)+'</td><td>'+eur(imp)+'</td></tr>';
  });
  var rit=op.ritenuta!=null?Number(op.ritenuta):0.20;
  var ritImp=lordo*rit, netto=lordo-ritImp, bollo=lordo>77.47?2:0;
  var nomeMese=new Date(mese+"-01").toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  var indir=[op.indirizzo, (op.cap||"")+" "+(op.comune||""), op.provincia].filter(function(x){return x&&String(x).trim();}).join(" — ");
  var h='<h1>Ricevuta per prestazione occasionale</h1>'+intestazioneProgetto()+
    '<div class="box"><b>'+esc((op.cognome||"")+" "+(op.nome||""))+'</b>'+(op.codice_fiscale?'<br>C.F. '+esc(op.codice_fiscale):'')+
    (indir?'<br>'+esc(indir):'')+(op.iban?'<br>IBAN '+esc(op.iban):'')+'</div>'+
    '<p>Per l’attività svolta nel mese di <b>'+esc(nomeMese)+'</b> nell’ambito del progetto Apayaye:</p>'+
    '<table><thead><tr><th>Incarico</th><th>Ore</th><th>Tariffa</th><th>Importo</th></tr></thead><tbody>'+body+
    '<tr class="tot"><td>Compenso lordo</td><td>'+totOre.toFixed(2).replace(".",",")+'</td><td></td><td>'+eur(lordo)+'</td></tr></tbody></table>'+
    '<table style="margin-top:12px"><tbody>'+
    '<tr><td>Compenso lordo</td><td style="text-align:right">'+eur(lordo)+'</td></tr>'+
    '<tr><td>Ritenuta d’acconto ('+Math.round(rit*100)+'%)</td><td style="text-align:right">− '+eur(ritImp)+'</td></tr>'+
    '<tr class="tot"><td>Netto a pagare</td><td style="text-align:right">'+eur(netto)+'</td></tr>'+
    (bollo?'<tr><td>Marca da bollo (compenso &gt; 77,47 €)</td><td style="text-align:right">'+eur(bollo)+'</td></tr>':'')+
    '</tbody></table>'+
    (senzaTariffa?'<p class="muted" style="margin-top:8px">⚠ '+senzaTariffa.toFixed(2).replace(".",",")+' ore senza tariffa (incarico senza €/h nel catalogo): non sono nel totale.</p>':'')+
    '<p class="muted" style="margin-top:8px">Bozza da verificare con l’ufficio prima dell’invio.</p>'+
    '<div class="firma"><div>Data ____________________</div><div>Firma ________________________</div></div>';
  stampaFinestra("Ricevuta "+mese, h);
}

async function salvaOp(tr, nuovo){
  var body=corpoOp(tr);
  if(!body.cognome || !body.nome){ opMsg("Cognome e nome sono obbligatori.","err"); return; }
  try{
    if(nuovo || !tr.getAttribute("data-id")){ await api("/operatori",{method:"POST",body:body}); }
    else { await api("/operatori/"+tr.getAttribute("data-id"),{method:"PUT",body:body}); }
    opMsg("Salvato.","ok"); var r=await api("/operatori"); opCache=r.operatori||[]; disegnaOperatori();
  }catch(e){ opMsg(e.message,"err"); }
}

var minoriCache = [];

function fasciaDa(dn){
  if(!dn) return "\u2014";
  var d=new Date(String(dn).slice(0,10)); if(isNaN(d.getTime())) return "\u2014";
  var o=new Date(), e=o.getFullYear()-d.getFullYear(), m=o.getMonth()-d.getMonth();
  if(m<0 || (m===0 && o.getDate()<d.getDate())) e--;
  if(e>=11 && e<=14) return "11-14";
  if(e>=15 && e<=17) return "15-17";
  return e+" anni";
}
function daVerificare(r){ return !!(r.note && String(r.note).trim()); }
function notaBreve(n){ return String(n==null?"":n).replace(/^Codice fiscale da verificare:\s*/i,""); }
function docCount(r){ return (r.doc_modulo?1:0)+(r.doc_identita_genitore?1:0)+(r.doc_consenso_privacy?1:0)+(r.doc_consenso_immagini?1:0); }

    '<div><label>Iscrizione</label><select id="m-fi"><option value="">Tutte</option>'+

    '<div><label>Da verificare</label><select id="m-fv"><option value="">Tutti</option>'+

      '<option value="no"'+(mFiltri.ver==="no"?" selected":"")+'>Solo a posto</option></select></div>'+
    '<div><label>Documenti</label><select id="m-fd"><option value="">Tutti</option>'+
      '<option value="completi"'+(mFiltri.doc==="completi"?" selected":"")+'>Completi (4/4)</option>'+
      '<option value="incompleti"'+(mFiltri.doc==="incompleti"?" selected":"")+'>Incompleti</option>'+
      '<option value="manca_gen"'+(mFiltri.doc==="manca_gen"?" selected":"")+'>Manca doc. genitore</option></select></div>'+
    '</div>';
  var avvisi = [];
  if(nVer){ avvisi.push('<span class="pill att">⚠ '+nVer+' da verificare</span>'); }
  if(nDocInc){ avvisi.push('<span class="pill att">📁 '+nDocInc+' con documenti incompleti</span>'); }
  if(avvisi.length){ h += '<p class="mini" style="margin-top:8px">'+avvisi.join(" &nbsp; ")+'</p>'; }
  $("m-strumenti").innerHTML = h;

  $("m-fi").addEventListener("change", function(){ mFiltri.iscr=this.value; disegnaTabellaMinori(); });
  $("m-fv").addEventListener("change", function(){ mFiltri.ver=this.value; disegnaTabellaMinori(); });
  $("m-fd").addEventListener("change", function(){ mFiltri.doc=this.value; disegnaTabellaMinori(); });
}

function minoriFiltrati(){
  var q = normTxt(mFiltri.q).trim();
  return minoriCache.filter(function(r){
    if(mFiltri.stato && r.stato !== mFiltri.stato) return false;
    if(mFiltri.iscr === "si" && !r.modulo_iscrizione) return false;
    if(mFiltri.iscr === "no" && r.modulo_iscrizione) return false;
    if(mFiltri.ver === "si" && !daVerificare(r)) return false;
    if(mFiltri.ver === "no" && daVerificare(r)) return false;
    if(mFiltri.doc === "completi" && docCount(r) < 4) return false;
    if(mFiltri.doc === "incompleti" && docCount(r) >= 4) return false;
    if(mFiltri.doc === "manca_gen" && r.doc_identita_genitore) return false;
    if(q){
      var blob = normTxt((r.cognome||"")+" "+(r.nome||"")+" "+(r.codice_fiscale||""));
      if(blob.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function disegnaTabellaMinori(){
  var righe = minoriFiltrati();
  var h = '<div class="scroll"><table><thead><tr><th>Cognome</th><th>Nome</th><th>Codice fiscale</th>'+

  if(!righe.length){
    h += '<tr><td colspan="12" class="muted" style="padding:14px">Nessun minore con questi filtri.</td></tr>';
  }
  righe.forEach(function(r){
    var ver = daVerificare(r);
    var dc = docCount(r);
    var manca = docManca(r);
    var docCell = (dc===4) ? '<span class="pill ok">4/4</span>'
      : '<span class="pill att" title="manca: '+esc(manca.join(", "))+'">'+dc+'/4</span>';
    h += '<tr'+(ver?' class="verifica"':'')+'><td>'+esc(r.cognome)+'</td><td>'+esc(r.nome)+'</td><td>'+esc(r.codice_fiscale)+'</td>'+
      '<td>'+esc(r.data_nascita||"")+'</td><td>'+esc(fasciaDa(r.data_nascita))+'</td><td>'+esc(r.scuola||"")+'</td><td>'+esc(r.stato||"")+'</td>'+

      '<td class="nota">'+(ver?'<span class="pill att">⚠ da verificare</span><div class="mini">'+esc(notaBreve(r.note))+'</div>':'')+'</td>'+
      '<td>'+(r.scheda_link?'<a href="'+esc(r.scheda_link)+'" target="_blank" rel="noopener" title="Apri la scheda di iscrizione">📄</a>':'')+'</td>'+
      '<td>'+docCell+'</td>'+
      '<td><button class="btn g sm" data-id="'+r.id+'">Apri</button></td></tr>';
  });
  var filtriAttivi = mFiltri.q || mFiltri.stato || mFiltri.iscr || mFiltri.ver || mFiltri.doc;
  h += '</tbody></table></div><p class="mini">'+righe.length+' di '+minoriCache.length+' minori'+(filtriAttivi?' (filtrati)':'')+'.</p>';
  $("m-body").innerHTML = h;

}

var importRighe = null;
var schedeRighe = null;
function vistaImporta(m){

    '<p class="muted">Carica il file di abbinamento (codice fiscale → link alla scheda su Dropbox) già preparato: '+
    'l\'app collega a ogni minore il suo modulo di iscrizione. <b>Prima mostra</b> cosa farebbe, poi scrivi. '+

  $("imp-file").addEventListener("change", leggiFile);
  $("sch-file").addEventListener("change", leggiFileSchede);
}
function leggiFile(ev){
  var file = ev.target.files[0]; if(!file) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false});
      importRighe = estraiRighe(aoa);
      if(!importRighe.length){ $("imp-msg").innerHTML = '<div class="msg err">Non ho trovato righe con un codice fiscale in questo foglio.</div>'; return; }
      anteprima();
    }catch(err){ $("imp-msg").innerHTML = '<div class="msg err">Non riesco a leggere il file: '+esc(err.message)+'</div>'; }
  };
  rd.readAsArrayBuffer(file);
}
function estraiRighe(aoa){
  var hi = -1;
  for(var i=0;i<aoa.length;i++){
    var riga = aoa[i]||[];
    if(riga.some(function(c){ return /codice fiscale/i.test(String(c||"")); })){ hi=i; break; }
  }
  if(hi<0) return [];
  var head = aoa[hi].map(function(c){return String(c||"").toLowerCase()});
  function col(re){ for(var j=0;j<head.length;j++){ if(re.test(head[j])) return j; } return -1; }
  var c = {cog:col(/cognome/), nom:col(/\bnome\b/), cf:col(/codice fiscale/), sn:col(/stato di nascita/),
    cn:col(/comune di nascita/), pr:col(/provincia/), ge:col(/genere/), note:col(/note/)};
  var out=[];
  for(var r=hi+1;r<aoa.length;r++){
    var row=aoa[r]||[]; var cf=(row[c.cf]||"").toString().trim();
    var cog=(c.cog>=0?row[c.cog]:"")||""; 
    if(!cf || !String(cog).trim()) continue;
    out.push({cognome:String(cog).trim(), nome:(c.nom>=0?String(row[c.nom]||"").trim():""),
      codice_fiscale:cf, stato_nascita:c.sn>=0?row[c.sn]:"", comune_nascita:c.cn>=0?row[c.cn]:"",
      provincia:c.pr>=0?row[c.pr]:"", genere:c.ge>=0?row[c.ge]:"",
      stato:c.note>=0?(row[c.note]||"").toString().trim():"", modulo_iscrizione:true});
  }
  return out;
}
async function anteprima(){
  $("imp-msg").innerHTML = '<div class="msg inf">Letti '+importRighe.length+' minori dal file. Controllo… (se il server era spento, puo\' metterci fino a un minuto)</div>';
  try{
    var r = await api("/minori/importa", {method:"POST", body:{prova:true, righe:importRighe}});
    var daVer = r.da_verificare||0;
    var h = '<div class="msg ok">Pronti: <b>'+r.creati+'</b> da aggiungere, <b>'+r.aggiornati+'</b> da aggiornare'+

      h += '<div class="card"><h2>Esclusi (non verranno scritti)</h2><div class="scroll"><table><thead><tr><th>Riga</th><th>Chi</th><th>Motivo</th></tr></thead><tbody>'+
        r.scartati.map(function(s){return '<tr><td>'+esc(s.riga)+'</td><td>'+esc((s.cognome||"")+" "+(s.nome||""))+'</td><td>'+esc(s.motivo)+'</td></tr>'}).join("")+
        '</tbody></table></div></div>';
    }
    h += '<div class="right"><button class="btn v" id="imp-scrivi">Scrivi i '+(r.creati+r.aggiornati+daVer)+' minori nell\'archivio</button></div>';
    $("imp-ris").innerHTML = h;
    $("imp-scrivi").addEventListener("click", scrivi);
  }catch(e){ $("imp-msg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }

  $("imp-scrivi").disabled = true; $("imp-scrivi").textContent = "Scrivo…";

  }catch(e){ $("imp-ris").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}
function leggiFileSchede(ev){
  var file = ev.target.files[0]; if(!file) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false});
      schedeRighe = estraiSchede(aoa);
      if(!schedeRighe.length){ $("sch-msg").innerHTML = '<div class="msg err">Non ho trovato righe con «codice fiscale» e «link» in questo file.</div>'; return; }
      anteprimaSchede();
    }catch(err){ $("sch-msg").innerHTML = '<div class="msg err">Non riesco a leggere il file: '+esc(err.message)+'</div>'; }
  };
  rd.readAsArrayBuffer(file);
}
function estraiSchede(aoa){
  var hi = -1;
  for(var i=0;i<aoa.length;i++){
    var riga = aoa[i]||[];
    if(riga.some(function(c){ return /codice fiscale/i.test(String(c||"")); }) && riga.some(function(c){ return /link/i.test(String(c||"")); })){ hi=i; break; }
  }
  if(hi<0) return [];
  var head = aoa[hi].map(function(c){return String(c||"").toLowerCase()});
  function col(re){ for(var j=0;j<head.length;j++){ if(re.test(head[j])) return j; } return -1; }
  var cCf=col(/codice fiscale/), cLink=col(/link/), cCog=col(/cognome/), cNom=col(/\bnome\b/);
  var out=[];
  for(var r=hi+1;r<aoa.length;r++){
    var row=aoa[r]||[];
    var cfv=String((cCf>=0?row[cCf]:"")||"").trim();
    var lk=String((cLink>=0?row[cLink]:"")||"").trim();
    if(!cfv || !lk) continue;
    out.push({codice_fiscale:cfv, link:lk, cognome:cCog>=0?String(row[cCog]||"").trim():"", nome:cNom>=0?String(row[cNom]||"").trim():""});
  }
  return out;
}
async function anteprimaSchede(){
  $("sch-msg").innerHTML = '<div class="msg inf">Leggo '+schedeRighe.length+' abbinamenti. Controllo…</div>';

        nt.map(function(s){return '<tr><td>'+esc((s.cognome||"")+" "+(s.nome||""))+'</td><td>'+esc(s.cf)+'</td></tr>'}).join("")+
        '</tbody></table></div></div>';

    h += '<div class="right"><button class="btn v" id="sch-scrivi">Collega le '+r.collegati+' schede</button></div>';
    $("sch-ris").innerHTML = h;
    $("sch-scrivi").addEventListener("click", scriviSchede);
  }catch(e){ $("sch-msg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }

async function scriviSchede(){

function dbxUrl(p, kind){
  var path = (DBX_BASE + p).replace(/^\//,"");
  return "https://www.dropbox.com/" + (kind==="file"?"preview":"home") + "/" + encodeURI(path);
}

function rcChip(chi){
  var cls = chi==="ufficio"?"ufficio":(chi==="operatore"?"operatore":"misto");
  var lab = chi==="misto"?"ufficio / operatore":chi;
  return '<span class="rc-chip '+cls+'">'+lab+'</span>';
}
function rcTabella(docs){
  var righe = docs.map(function(d){
    var tipo = d.k==="app" ? '<span class="rc-tag app">app</span>'
             : '<span class="rc-tag '+(d.tag||"")+'">'+(d.tag||"file")+'</span>';
    var link = d.k==="app"
      ? '<button class="rc-link app" data-v="'+d.v+'" title="Apri nell\'app">Apri →</button>'
      : '<a class="rc-link" href="'+dbxUrl(d.p,d.k)+'" target="_blank" rel="noopener" title="Apri su Dropbox">Apri ↗</a>';
    return '<tr><td>'+esc(d.t)+'</td><td>'+tipo+'</td><td style="text-align:right">'+link+'</td></tr>';
  }).join("");
  var haCartelle = docs.some(function(d){ return d.k==="folder"; });
  return '<div class="scroll"><table><thead><tr><th>Documento</th><th>Tipo</th><th></th></tr></thead><tbody>'+righe+'</tbody></table></div>'+
    (haCartelle?'<p class="mini" style="margin:8px 2px 0">I singoli file (con i nomi dei minori) si aprono dentro la cartella su Dropbox.</p>':'');
}
function caricaFileVoce(li, voce){
  var box = li.querySelector(".rc-files");
  if(!box || box.getAttribute("data-loaded")==="1" || !voce) return;
  box.setAttribute("data-loaded","1");
  var cartelle = (voce.docs||[]).filter(function(d){ return d.k==="folder"; });
  if(!cartelle.length) return;
  cartelle.forEach(function(d){
    var sec=document.createElement("div"); sec.className="rc-filesec";
    sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+' <span class="mini">— carico\u2026</span></div>';
    box.appendChild(sec);
    var full = DBX_BASE + d.p;
    api("/rendicontazione/documenti?path="+encodeURIComponent(full)).then(function(r){
      if(!r || r.configurato===false){
        sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+'</div><p class="mini">I file sono su Dropbox: usa \u00abApri \u2197\u00bb qui sopra. (Per vederli elencati qui, collega Dropbox al server.)</p>'; return;
      }
      if(r.errore || !r.file){
        sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+'</div><p class="mini">Non riesco a leggere la cartella ora: usa \u00abApri \u2197\u00bb.</p>'; return;
      }
      if(!r.file.length){
        sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+'</div><p class="mini">(cartella vuota)</p>'; return;
      }
      var voci=r.file.map(function(f){
        return '<li><span class="rc-fico">'+(f.cartella?"\ud83d\udcc1":"\ud83d\udcc4")+'</span><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.nome)+'</a></li>';
      }).join("");
      sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+' <span class="mini">\u2014 '+r.file.length+' elementi</span></div><ul class="rc-filelist">'+voci+'</ul>';
    }).catch(function(e){
      sec.innerHTML='<div class="rc-filehead">'+esc(d.t)+'</div><p class="mini">'+esc((e&&e.message)||"errore")+'</p>';
    });
  });
}
function vistaRendic(m){
  m.innerHTML = '<div class="card rc-intro"><div class="rc-band"><h1>Rendicontazione</h1><span>PNRR · ReGiS</span></div>'+
    '<p class="muted">Tutto quello che serve per le attività e la rendicontazione del progetto. '+
    'Tocca una voce per aprire i <b>collegamenti ai documenti</b> dentro la cartella del progetto su Dropbox («Progetti in itinere → Apayaye»). '+
    'Le voci con l\'importo alimentano la contabilità (progetti → Apayaye).</p>'+
    '<ul class="rc-list">'+CHECKLIST.map(function(c,i){
      return '<li class="rc-item" data-i="'+i+'">'+
        '<button class="rc-head" type="button"><span class="rc-check">✓</span>'+
        '<span class="rc-tit"><b>'+esc(c.t)+'</b>'+(c.nota?'<div class="mini">'+esc(c.nota)+'</div>':'')+'</span>'+
        rcChip(c.chi)+'<span class="rc-caret">›</span></button>'+
        '<div class="rc-body">'+rcTabella(c.docs)+'<div class="rc-files"></div></div></li>';
    }).join("")+'</ul></div>'+
    '<div class="card"><h2>La guida ufficiale</h2><p class="muted">I documenti ReGiS stanno nella cartella «10 - Regis» del progetto su Dropbox: Linee guida rendicontazione (SA) 2025, le slide del webinar, gli Indicatori e Target.</p>'+
    rcTabella([ {t:"Linee guida rendicontazione (SA) 2025", k:"file", p:"/08 - Rendicontazione/Modulistica/pe_linee_guida_sa_2025.pdf", tag:"modello"},
                {t:"Cartella ReGiS (guide, indicatori, target)", k:"folder", p:"/10 - Regis", tag:"cartella"},
                {t:"Modulistica ministeriale", k:"folder", p:"/08 - Rendicontazione/Modulistica", tag:"cartella"} ])+'</div>';
  Array.prototype.forEach.call(m.querySelectorAll(".rc-head"), function(h){
    h.addEventListener("click", function(){
      var li=h.parentNode; li.classList.toggle("open");
      if(li.classList.contains("open")){ try{ caricaFileVoce(li, CHECKLIST[+li.getAttribute("data-i")]); }catch(e){} }
    });
  });
  Array.prototype.forEach.call(m.querySelectorAll(".rc-link.app"), function(b){
    b.addEventListener("click", function(e){ e.stopPropagation(); vistaCorr = b.getAttribute("data-v"); avviaApp(); });
  });
}

/* ---------- UTENTI ---------- */
async function vistaUtenti(m){
  m.innerHTML = '<div class="card"><h1>Utenti e accessi</h1><div id="u-msg"></div>'+
    '<div class="card" style="background:#f8fbfc"><h2>Invita un utente</h2>'+
    '<div class="row">'+campo("Email","u-email",""," ")+
    '<div><label>Ruolo</label><select id="u-ruolo"><option value="ufficio">ufficio</option><option value="operatore">operatore</option><option value="genitore">genitore</option><option value="admin">admin</option></select></div>'+
    '<div style="flex:0"><label>&nbsp;</label><button class="btn p" id="u-invita">Invita</button></div></div>'+
    '<div id="u-invmsg"></div></div>'+
    '<div id="u-body" class="muted">Carico…</div></div>';
  $("u-invita").addEventListener("click", async function(){
    var em = $("u-email").value.trim();
    if(!em){ return; }
    try{
      var r = await api("/auth/inviti", {method:"POST", body:{email:em, ruolo:$("u-ruolo").value}});
      $("u-invmsg").innerHTML = '<div class="msg ok">Invitato '+esc(r.email)+'. Password provvisoria da consegnare: <code>'+esc(r.password_provvisoria)+'</code> (la cambierà al primo accesso).</div>';
      $("u-email").value=""; caricaUtenti();
    }catch(e){ $("u-invmsg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
  });
  caricaUtenti();
}
async function caricaUtenti(){
  try{
    var righe = await api("/auth/utenti");
    var ops=[]; try{ ops=(await api("/operatori")).operatori||[]; }catch(e){}
    var gens=[]; try{ gens=(await api("/genitore/elenco")).genitori||[]; }catch(e){}
    function opts(lista, sel){ return '<option value="">— nessuno —</option>'+lista.map(function(o){ return '<option value="'+o.id+'"'+(String(o.id)===String(sel||"")?' selected':'')+'>'+esc(o.cognome+" "+o.nome)+'</option>'; }).join(""); }
    var h = '<div class="scroll"><table><thead><tr><th>Email</th><th>Ruolo</th><th>Operatore</th><th>Genitore</th><th>Stato</th><th></th></tr></thead><tbody>';
    righe.forEach(function(r){
      h += '<tr data-uid="'+r.id+'"><td>'+esc(r.email)+'</td><td>'+esc(r.ruolo)+'</td>'+
        '<td><select class="u-op">'+opts(ops, r.operatore_id)+'</select></td>'+
        '<td><select class="u-ge">'+opts(gens, r.genitore_id)+'</select></td>'+
        '<td>'+(r.attivo?'<span class="pill ok">attivo</span>':'<span class="pill no">sospeso</span>')+'</td>'+
        '<td><button class="btn g sm" data-id="'+r.id+'" data-a="'+(r.attivo?0:1)+'">'+(r.attivo?"Sospendi":"Riattiva")+'</button></td></tr>';
    });
    h += '</tbody></table></div><p class="mini">Collega un accesso <b>operatore</b> (per timbrare e la ricevuta) o <b>genitore</b> (per vedere le presenze dei figli) al suo nominativo.</p>';
    $("u-body").innerHTML = h;
    Array.prototype.forEach.call($("u-body").querySelectorAll("button[data-id]"), function(b){
      b.addEventListener("click", async function(){
        try{ await api("/auth/utenti/"+b.getAttribute("data-id")+"/attivo", {method:"POST", body:{attivo: b.getAttribute("data-a")==="1"}}); caricaUtenti(); }
        catch(e){ $("u-msg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
      });
    });
    async function collega(tr){
      var uid=tr.getAttribute("data-uid"), op=tr.querySelector(".u-op").value, ge=tr.querySelector(".u-ge").value;
      try{ await api("/auth/utenti/"+uid+"/collega", {method:"POST", body:{operatore_id: op?+op:null, genitore_id: ge?+ge:null}});
        $("u-msg").innerHTML='<div class="msg ok">Collegamento aggiornato.</div>'; }
      catch(e){ $("u-msg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; caricaUtenti(); }
    }
    Array.prototype.forEach.call($("u-body").querySelectorAll("select.u-op, select.u-ge"), function(s){
      s.addEventListener("change", function(){ collega(s.closest("tr")); });
    });
  }catch(e){ $("u-body").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}
